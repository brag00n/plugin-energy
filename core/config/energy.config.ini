; this is an INI file
[energy]
currency = €
rateMode = fixed
; Fixed part of the bill, per day, in the currency (0 = none)
subscriptionDaily = 0
; First day (YYYY-MM-DD) from which the total counter is trusted; before it the days keep the sum of the equipments
counterReliableSince =
; Subscribed power in kVA: an index that jumps by more than this power x the cycle duration is ignored (0 = off)
energySubscribedPower = 0
; Types of debug traces (see core/class/energyLogTypes.class.php): 1 = written when the log level is debug
logPerf = 1
logAnomaly = 1
